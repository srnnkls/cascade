name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  source-length:
    name: Source file length
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check no production source file exceeds the line cap
        run: python3 scripts/check-source-file-length.py

  check:
    name: Check (aarch64-apple-darwin)
    timeout-minutes: 30
    runs-on: macos-latest
    # sccache wraps rustc so individual compilation units survive Cargo.lock
    # changes, which invalidate rust-cache's target/ wholesale. rust-cache
    # below still carries the registry/git/deps.
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Install sccache
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: sccache
      - name: Configure sccache dir
        # runner.temp is not available in job-level env, so export SCCACHE_DIR
        # here. It matches the actions/cache path below.
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Restore sccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: sccache
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-check-aarch64-apple-darwin-${{ github.sha }}
          restore-keys: sccache-check-aarch64-apple-darwin-
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Share the compiled-dependency cache with the `test` job — dependency
          # builds dominate, and clippy vs test only differ in the workspace
          # crates' own artifacts. `save-if` restricts cache writes to main so
          # feature-branch churn can't evict the warm main-line cache (GHA's
          # 10 GB LRU).
          shared-key: aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        # --all-targets so test and bench code is linted too, not just lib/bin.
        # -D warnings promotes every clippy warning (including default-level
        # lints the workspace table does not explicitly deny) to an error.
        # The four restriction lints (unwrap_used/expect_used/indexing_slicing/
        # string_slice) are scoped out of test code at each crate root — see
        # the comment in the root Cargo.toml's [workspace.lints.clippy].
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: sccache stats
        run: sccache --show-stats
      - name: Save sccache
        # Mirror rust-cache's save-if policy: only main writes the cache so
        # feature-branch churn can't evict the warm main-line entry.
        if: github.ref == 'refs/heads/main'
        # sccache is a build-time accelerator; an empty or failed cache save
        # is a noisy warning, not a real failure. Continue on error so the
        # post-build upload doesn't pollute the run summary.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-check-aarch64-apple-darwin-${{ github.sha }}

  test:
    name: Test (aarch64-apple-darwin)
    timeout-minutes: 30
    runs-on: macos-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install sccache
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: sccache
      - name: Configure sccache dir
        # runner.temp is not available in job-level env, so export SCCACHE_DIR
        # here. It matches the actions/cache path below.
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
      - name: Restore sccache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-test-aarch64-apple-darwin-${{ github.sha }}
          restore-keys: sccache-test-aarch64-apple-darwin-
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests
        run: cargo test --workspace
      - name: sccache stats
        run: sccache --show-stats
      - name: Save sccache
        if: github.ref == 'refs/heads/main'
        # sccache is a build-time accelerator; an empty or failed cache save
        # is a noisy warning, not a real failure. Continue on error so the
        # post-build upload doesn't pollute the run summary.
        continue-on-error: true
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-test-aarch64-apple-darwin-${{ github.sha }}

  # Runs the CascadeFileProviderKit unit tests and builds the host app with the
  # embedded File Provider extension, unsigned. The package and the project
  # target macOS 26, so the runner needs Xcode 26; the host app's build phase
  # compiles the `cascade` daemon with cargo, so the job installs the toolchain
  # rust-toolchain.toml names and caches its target directory.
  swift:
    name: Swift (File Provider)
    timeout-minutes: 40
    runs-on: macos-26
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: swift-host
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test CascadeFileProviderKit
        run: swift test --package-path swift/CascadeFileProviderKit
      - name: Build the host app and extension (unsigned)
        run: >
          xcodebuild -project swift/CascadeFileProvider.xcodeproj
          -scheme CascadeFileProviderHost -configuration Debug
          -destination "platform=macOS"
          CODE_SIGNING_ALLOWED=NO
          build
